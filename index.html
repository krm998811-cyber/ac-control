<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>تحكم المكيف عن بُعد</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #0b1720;
    --bg-panel: #10222e;
    --accent: #2dd4bf;
    --accent-dim: #14524a;
    --off-color: #64748b;
    --on-color: #2dd4bf;
    --text: #e6f1ef;
    --text-dim: #7c96a0;
    --danger: #f87171;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #133447 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }
 
  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    color: var(--text);
  }
 
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 28px;
  }
 
  .connection-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }
 
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--off-color);
    transition: background 0.3s ease;
  }
 
  .dot.live { background: var(--on-color); box-shadow: 0 0 8px var(--on-color); }
  .dot.error { background: var(--danger); }
 
  .ring {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-panel);
    border: 3px solid var(--off-color);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    margin-bottom: 32px;
    position: relative;
  }
 
  .ring.on {
    border-color: var(--on-color);
    box-shadow: 0 0 40px -8px var(--on-color);
  }
 
  .ring-inner {
    text-align: center;
  }
 
  .state-label {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
 
  .state-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }
 
  .controls {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 18px;
  }
 
  button {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 18px 10px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
 
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
 
  .btn-on {
    background: var(--accent);
    color: #04211d;
  }
 
  .btn-off {
    background: #1c2e38;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
  }
 
  .btn-toggle {
    width: 100%;
    max-width: 360px;
    background: transparent;
    color: var(--text-dim);
    border: 1px dashed rgba(255,255,255,0.15);
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
  }
 
  .log {
    margin-top: 40px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    max-width: 320px;
    line-height: 1.6;
  }
 
  .battery-warning {
    display: none;
    background: #f39c12;
    color: #1a1a1a;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 18px;
    max-width: 340px;
    text-align: center;
  }
 
  .battery-warning.show { display: block; }
 
  .card {
    background: var(--bg-panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
    width: 100%;
    max-width: 360px;
  }
 
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--text);
  }
 
  .card form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
 
  input[type="time"], input[type="text"], input[type="password"], input[type="number"], select {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0e1c26;
    color: var(--text);
    width: 100%;
    box-sizing: border-box;
  }
 
  .card form label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
 
  .days-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-start;
  }
 
  .day-label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
    background: #0e1c26;
    padding: 6px 8px;
    border-radius: 8px;
  }
 
  .add-btn {
    background: var(--accent);
    color: #04211d;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
  }
 
  .list-item {
    background: #0e1c26;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
 
  .list-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
 
  .list-item .days-text {
    font-size: 11px;
    color: var(--text-dim);
  }
 
  .small-btn {
    background: #2a3b46;
    color: var(--text);
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    flex: none;
  }
 
  .empty-note {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
 
  <h1>تحكم المكيف</h1>
  <div class="subtitle">يعمل من أي مكان عبر الإنترنت</div>
 
  <div class="battery-warning" id="batteryWarning">⚠️ البطارية قاربت على الانتهاء - يفضل الشحن قريبًا</div>
  <div class="battery-warning" id="protectionWarning" style="background:#3b82f6;color:white;"></div>
 
  <div class="connection-pill">
    <span class="dot" id="connDot"></span>
    <span id="connText">جاري الاتصال...</span>
  </div>
 
  <div class="ring" id="ring">
    <div class="ring-inner">
      <div class="state-label" id="stateLabel">—</div>
      <div class="state-sub" id="stateSub">بانتظار الحالة</div>
    </div>
  </div>
 
  <div class="controls">
    <button class="btn-on" id="btnOn" disabled>تشغيل</button>
    <button class="btn-off" id="btnOff" disabled>إيقاف</button>
  </div>
  <button class="btn-toggle" id="btnToggle" disabled>تبديل الحالة</button>
  <button class="btn-toggle" id="btnSettings">⚙️ الإعدادات</button>
 
  <div class="card">
    <h2>إضافة منبه (وقت محدد)</h2>
    <form id="timerForm">
      <input type="time" id="timerTime" required>
      <select id="timerAction">
        <option value="0">تشغيل</option>
        <option value="1" selected>إيقاف</option>
        <option value="2">تبديل</option>
      </select>
      <button type="submit" class="add-btn">إضافة المنبه</button>
    </form>
  </div>
 
  <div class="card">
    <h2>المنبهات النشطة</h2>
    <div id="timerList"><p class="empty-note">لا يوجد منبهات نشطة حاليًا</p></div>
  </div>
 
  <div class="card">
    <h2>إضافة جدولة متكررة</h2>
    <form id="scheduleForm">
      <input type="time" id="scheduleTime" required>
      <select id="scheduleAction">
        <option value="0">تشغيل</option>
        <option value="1" selected>إيقاف</option>
        <option value="2">تبديل</option>
      </select>
      <div class="days-row" id="dayCheckboxes"></div>
      <button type="submit" class="add-btn">إضافة الجدولة</button>
    </form>
  </div>
 
  <div class="card">
    <h2>الجداول المتكررة</h2>
    <div id="scheduleList"><p class="empty-note">لا يوجد جداول متكررة حاليًا</p></div>
  </div>
 
  <div class="card" id="settingsCard" style="display:none;">
    <h2>الإعدادات</h2>
 
    <h3 style="font-size:13px;margin:6px 0;color:var(--text-dim);">تغيير شبكة الواي فاي</h3>
    <form id="wifiForm">
      <input type="text" id="wifiSSID" placeholder="اسم الشبكة" required>
      <input type="password" id="wifiPassword" placeholder="كلمة مرور جديدة (اتركه فارغًا لعدم التغيير)">
      <button type="submit" class="add-btn">حفظ وإعادة التشغيل</button>
    </form>
  </div>
 
  <div class="log" id="log">—</div>
 
<script>
  const MQTT_HOST = "281efffbd9e1453885679644f0a59686.s1.eu.hivemq.cloud";
  const MQTT_PORT = 8884;
  const MQTT_USER = "krm_ac_device";
  const MQTT_PASS = "Abokrem9118";
 
  const TOPIC_COMMAND = "ac/krm/command";
  const TOPIC_STATUS = "ac/krm/status";
  const TOPIC_BATTERY = "ac/krm/battery";
  const TOPIC_PROTECTION = "ac/krm/protection";
  const TOPIC_TIMER_ADD = "ac/krm/timer/add";
  const TOPIC_TIMER_CANCEL = "ac/krm/timer/cancel";
  const TOPIC_TIMER_LIST = "ac/krm/timer/list";
  const TOPIC_SCHEDULE_ADD = "ac/krm/schedule/add";
  const TOPIC_SCHEDULE_DELETE = "ac/krm/schedule/delete";
  const TOPIC_SCHEDULE_TOGGLE = "ac/krm/schedule/toggle";
  const TOPIC_SCHEDULE_LIST = "ac/krm/schedule/list";
  const TOPIC_WIFI_SET = "ac/krm/wifi_set";
 
  const dayNamesAr = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const actionNamesAr = ["تشغيل", "إيقاف", "تبديل"];
 
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const ring = document.getElementById('ring');
  const stateLabel = document.getElementById('stateLabel');
  const stateSub = document.getElementById('stateSub');
  const btnOn = document.getElementById('btnOn');
  const btnOff = document.getElementById('btnOff');
  const btnToggle = document.getElementById('btnToggle');
  const log = document.getElementById('log');
  const batteryWarning = document.getElementById('batteryWarning');
  const protectionWarning = document.getElementById('protectionWarning');
  let protectionCountdownTimer = null;
  let protectionRemainingSec = 0;
  const timerForm = document.getElementById('timerForm');
  const timerList = document.getElementById('timerList');
  const scheduleForm = document.getElementById('scheduleForm');
  const scheduleList = document.getElementById('scheduleList');
  const dayCheckboxes = document.getElementById('dayCheckboxes');
  const wifiForm = document.getElementById('wifiForm');
  const btnSettings = document.getElementById('btnSettings');
  const settingsCard = document.getElementById('settingsCard');
 
  // بناء مربعات اختيار الأيام ديناميكيًا
  dayNamesAr.forEach((name, idx) => {
    const label = document.createElement('label');
    label.className = 'day-label';
    label.innerHTML = `<input type="checkbox" data-day="${idx}"> ${name}`;
    dayCheckboxes.appendChild(label);
  });
 
  function setButtonsEnabled(enabled) {
    btnOn.disabled = !enabled;
    btnOff.disabled = !enabled;
    btnToggle.disabled = !enabled;
  }
 
  function renderState(isOn) {
    if (isOn) {
      ring.classList.add('on');
      stateLabel.textContent = 'يعمل';
      stateSub.textContent = 'المكيف مشغّل الآن';
    } else {
      ring.classList.remove('on');
      stateLabel.textContent = 'مطفأ';
      stateSub.textContent = 'المكيف متوقف الآن';
    }
  }
 
  function stopProtectionCountdown() {
    if (protectionCountdownTimer) {
      clearInterval(protectionCountdownTimer);
      protectionCountdownTimer = null;
    }
    protectionWarning.classList.remove('show');
  }
 
  function updateProtectionText() {
    const mins = Math.floor(protectionRemainingSec / 60);
    const secs = protectionRemainingSec % 60;
    protectionWarning.textContent = `⏳ حماية الكمبروسر مفعّلة - يمكن التشغيل بعد ${mins} د ${secs} ث`;
  }
 
  function startProtectionCountdown(remainingSec) {
    stopProtectionCountdown();
    protectionRemainingSec = remainingSec;
    if (protectionRemainingSec <= 0) return;
 
    protectionWarning.classList.add('show');
    updateProtectionText();
 
    protectionCountdownTimer = setInterval(() => {
      protectionRemainingSec--;
      if (protectionRemainingSec <= 0) {
        stopProtectionCountdown();
      } else {
        updateProtectionText();
      }
    }, 1000);
  }
 
  function renderTimers(list) {
    if (!list || list.length === 0) {
      timerList.innerHTML = '<p class="empty-note">لا يوجد منبهات نشطة حاليًا</p>';
      return;
    }
    timerList.innerHTML = list.map(t => `
      <div class="list-item">
        <div class="list-item-top">
          <span>${actionNamesAr[t.action]} الساعة ${t.time}</span>
          <button class="small-btn" onclick="cancelTimer(${t.id})">إلغاء</button>
        </div>
      </div>
    `).join('');
  }
 
  function renderSchedules(list) {
    if (!list || list.length === 0) {
      scheduleList.innerHTML = '<p class="empty-note">لا يوجد جداول متكررة حاليًا</p>';
      return;
    }
    scheduleList.innerHTML = list.map(s => {
      const daysStr = s.days.map((v, i) => v ? dayNamesAr[i] : null).filter(Boolean).join('، ') || 'بدون أيام محددة';
      const statusLabel = s.enabled ? 'مفعّل' : 'معطّل';
      const toggleLabel = s.enabled ? 'تعطيل' : 'تفعيل';
      return `
        <div class="list-item">
          <div class="list-item-top">
            <span><b>${actionNamesAr[s.action]}</b> الساعة ${s.time} (${statusLabel})</span>
          </div>
          <span class="days-text">${daysStr}</span>
          <div class="list-item-top">
            <button class="small-btn" onclick="toggleSchedule(${s.id})">${toggleLabel}</button>
            <button class="small-btn" onclick="deleteSchedule(${s.id})">حذف</button>
          </div>
        </div>
      `;
    }).join('');
  }
 
  const client = mqtt.connect(`wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`, {
    username: MQTT_USER,
    password: MQTT_PASS,
    clientId: 'webctrl-' + Math.random().toString(16).slice(2),
    reconnectPeriod: 3000,
  });
 
  client.on('connect', function () {
    connDot.className = 'dot live';
    connText.textContent = 'متصل';
    log.textContent = 'متصل بالخادم، بانتظار حالة الجهاز...';
    setButtonsEnabled(true);
    client.subscribe(TOPIC_STATUS);
    client.subscribe(TOPIC_BATTERY);
    client.subscribe(TOPIC_PROTECTION);
    client.subscribe(TOPIC_TIMER_LIST);
    client.subscribe(TOPIC_SCHEDULE_LIST);
  });
 
  client.on('reconnect', function () {
    connDot.className = 'dot';
    connText.textContent = 'جاري إعادة الاتصال...';
    setButtonsEnabled(false);
  });
 
  client.on('close', function () {
    connDot.className = 'dot';
    connText.textContent = 'غير متصل';
    setButtonsEnabled(false);
  });
 
  client.on('error', function (err) {
    connDot.className = 'dot error';
    connText.textContent = 'خطأ بالاتصال';
    log.textContent = 'تعذر الاتصال بالخادم. تحقق من الإنترنت.';
    setButtonsEnabled(false);
  });
 
  client.on('message', function (topic, payload) {
    const msg = payload.toString().trim();
 
    if (topic === TOPIC_STATUS) {
      renderState(msg.toLowerCase() === 'on');
      log.textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA');
    }
    else if (topic === TOPIC_BATTERY) {
      batteryWarning.classList.toggle('show', msg.toLowerCase() === 'low');
    }
    else if (topic === TOPIC_PROTECTION) {
      if (msg.toLowerCase() === 'idle') {
        stopProtectionCountdown();
      } else if (msg.startsWith('active:')) {
        const secs = parseInt(msg.split(':')[1], 10);
        if (!isNaN(secs)) startProtectionCountdown(secs);
      }
    }
    else if (topic === TOPIC_TIMER_LIST) {
      try { renderTimers(JSON.parse(msg)); } catch (e) {}
    }
    else if (topic === TOPIC_SCHEDULE_LIST) {
      try { renderSchedules(JSON.parse(msg)); } catch (e) {}
    }
  });
 
  function sendCommand(cmd) {
    client.publish(TOPIC_COMMAND, cmd);
    log.textContent = 'تم إرسال الأمر: ' + (cmd === 'on' ? 'تشغيل' : cmd === 'off' ? 'إيقاف' : 'تبديل');
  }
 
  btnOn.addEventListener('click', () => sendCommand('on'));
  btnOff.addEventListener('click', () => sendCommand('off'));
  btnToggle.addEventListener('click', () => sendCommand('toggle'));
 
  timerForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const time = document.getElementById('timerTime').value;
    const action = document.getElementById('timerAction').value;
    if (!time) return;
    client.publish(TOPIC_TIMER_ADD, `${time},${action}`);
    log.textContent = 'تم إرسال طلب إضافة منبه';
  });
 
  function cancelTimer(id) {
    client.publish(TOPIC_TIMER_CANCEL, String(id));
    log.textContent = 'تم إرسال طلب إلغاء منبه';
  }
 
  scheduleForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const time = document.getElementById('scheduleTime').value;
    const action = document.getElementById('scheduleAction').value;
    if (!time) return;
    const checks = dayCheckboxes.querySelectorAll('input[type="checkbox"]');
    let daysStr = '';
    checks.forEach(c => { daysStr += c.checked ? '1' : '0'; });
    client.publish(TOPIC_SCHEDULE_ADD, `${time},${action},${daysStr}`);
    log.textContent = 'تم إرسال طلب إضافة جدولة';
  });
 
  function toggleSchedule(id) {
    client.publish(TOPIC_SCHEDULE_TOGGLE, String(id));
    log.textContent = 'تم إرسال طلب تبديل حالة جدولة';
  }
 
  function deleteSchedule(id) {
    client.publish(TOPIC_SCHEDULE_DELETE, String(id));
    log.textContent = 'تم إرسال طلب حذف جدولة';
  }
 
  wifiForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const ssid = document.getElementById('wifiSSID').value;
    const pass = document.getElementById('wifiPassword').value;
    if (!ssid) return;
    const payload = pass.length > 0 ? { ssid, password: pass } : { ssid };
    client.publish(TOPIC_WIFI_SET, JSON.stringify(payload));
    log.textContent = 'تم إرسال إعدادات الواي فاي الجديدة - الجهاز سيعيد التشغيل';
  });
 
  btnSettings.addEventListener('click', function () {
    settingsCard.style.display = (settingsCard.style.display === 'none') ? 'block' : 'none';
  });
 
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
 
</body>
</html>
